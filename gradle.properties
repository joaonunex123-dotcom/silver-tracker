org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# O AGP e anterior ao SDK 37 e avisa que nao foi testado com ele.
android.suppressUnsupportedCompileSdk=37

# O KSP ainda registra as fontes que gera (o codigo do Room) via kotlin.sourceSets,
# e o Kotlin embutido do AGP 9 recusa isso por padrao. Escape hatch sugerido pelo
# proprio AGP; pode sair quando o KSP passar a usar android.sourceSets.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
