name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SDK do Android
        uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Testes unitarios
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publica o APK como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silver-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Publica o relatorio dos testes quando falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Release so em tag: da um link direto para baixar no celular, sem zip.
      - name: Release com o APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "APK de debug, assinado com a chave de debug padrao. No celular, autorize a instalacao de apps de fontes desconhecidas."
